{% comment %}
Bulby, the MathsToons lightbulb with round glasses.

  mood   "happy" (default), "think" (eyes up, wavy mouth) or "cheer" (both hands up)
  uid    unique suffix for gradient ids when more than one is on a page
  cls    extra classes for the <svg>, e.g. "mascot-float"
  label  accessible name; omit for a purely decorative figure
{% endcomment %}
<svg class="mascot {{ cls }}" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg" {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true" focusable="false"{% endif %}>
  <defs>
    <radialGradient id="bulbFill{{ uid|default:'m' }}" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.45" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#f5a90f"/>
    </radialGradient>
    <radialGradient id="bulbGlow{{ uid|default:'m' }}" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe066" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle class="bulb-glow" cx="60" cy="50" r="52" fill="url(#bulbGlow{{ uid|default:'m' }})"/>

  <!-- rays -->
  <g stroke="#ffd43b" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="2" x2="60" y2="9"/>
    <line x1="26" y1="14" x2="31" y2="19"/>
    <line x1="94" y1="14" x2="89" y2="19"/>
  </g>

  <!-- arms + gloves -->
  {% if mood == "cheer" %}
  <path d="M32 62 L17 40" stroke="#0b1640" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M88 62 L103 40" stroke="#0b1640" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="15" cy="36" r="7" fill="#fff" stroke="#0b1640" stroke-width="3"/>
  <circle cx="105" cy="36" r="7" fill="#fff" stroke="#0b1640" stroke-width="3"/>
  {% else %}
  <path d="M32 64 L18 46" stroke="#0b1640" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M15.5 44 L15.5 31 a3 3 0 0 1 6 0 L21.5 44" fill="#fff" stroke="#0b1640" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="17" cy="46" r="7" fill="#fff" stroke="#0b1640" stroke-width="3"/>
  <path d="M88 66 L101 76" stroke="#0b1640" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="104" cy="78" r="7" fill="#fff" stroke="#0b1640" stroke-width="3"/>
  {% endif %}

  <!-- glass -->
  <path d="M60 14 A36 36 0 0 1 82.2 78.4 C78.5 81.5 76 85.5 76 90 L44 90 C44 85.5 41.5 81.5 37.8 78.4 A36 36 0 0 1 60 14 Z"
        fill="url(#bulbFill{{ uid|default:'m' }})" stroke="#0b1640" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M38 40 C40 30 47 23 56 21" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- screw base -->
  <rect x="43" y="90" width="34" height="8" rx="3" fill="#a9b4d6" stroke="#0b1640" stroke-width="3"/>
  <rect x="44.5" y="98" width="31" height="7" rx="3" fill="#8592bd" stroke="#0b1640" stroke-width="3"/>
  <path d="M48 105 h24 l-4 8 a4 4 0 0 1 -3.6 2.3 h-8.8 a4 4 0 0 1 -3.6 -2.3 z" fill="#5d6894" stroke="#0b1640" stroke-width="3" stroke-linejoin="round"/>

  <!-- cheeks -->
  <circle cx="38" cy="63" r="5" fill="#ff8a6b" opacity="0.55"/>
  <circle cx="82" cy="63" r="5" fill="#ff8a6b" opacity="0.55"/>

  <!-- glasses -->
  <g stroke="#0b1640" stroke-width="3.5">
    <circle cx="48" cy="48" r="11.5" fill="#fff"/>
    <circle cx="72" cy="48" r="11.5" fill="#fff"/>
    <line x1="59.5" y1="47" x2="60.5" y2="47"/>
  </g>
  {% if mood == "think" %}
  <circle cx="45" cy="44" r="4.6" fill="#0b1640"/><circle cx="46.4" cy="42.6" r="1.5" fill="#fff"/>
  <circle cx="69" cy="44" r="4.6" fill="#0b1640"/><circle cx="70.4" cy="42.6" r="1.5" fill="#fff"/>
  <path d="M51 71 q4 -3 8 0 t9 0" stroke="#0b1640" stroke-width="3" stroke-linecap="round" fill="none"/>
  {% else %}
  <circle cx="49.5" cy="49.5" r="4.8" fill="#0b1640"/><circle cx="51" cy="48" r="1.6" fill="#fff"/>
  <circle cx="73.5" cy="49.5" r="4.8" fill="#0b1640"/><circle cx="75" cy="48" r="1.6" fill="#fff"/>
  <path d="M48 66 Q60 82 72 66 Q60 71 48 66 Z" fill="#0b1640" stroke="#0b1640" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M55 73.5 Q60 77 65 73.5 Q60 71.5 55 73.5 Z" fill="#ff6b6b"/>
  {% endif %}
</svg>
